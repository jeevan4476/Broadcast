[workspace]
resolver = "2"
members = [
    "crates/nvb-core",
    "crates/nvb-audio",
    "crates/nvb-video",
    "crates/nvb-daemon",
    "crates/nvb-cli",
    "crates/nvb-camera-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jeevan4476/Broadcast"

[workspace.dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
nnnoiseless = "0.5"
realfft = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "sync", "time", "macros", "io-util"] }
tokio-stream = "0.1"
nvb-core = { path = "crates/nvb-core" }
nvb-audio = { path = "crates/nvb-audio" }
nvb-video = { path = "crates/nvb-video" }
