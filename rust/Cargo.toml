[workspace]
resolver = "2"
members = [
    "crates/nvb-core",
    "crates/nvb-audio",
    "crates/nvb-video",
    "crates/nvb-daemon",
    "crates/nvb-cli",
    "crates/nvb-camera-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jeevan4476/Broadcast"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
nvb-core = { path = "crates/nvb-core" }
nvb-audio = { path = "crates/nvb-audio" }
nvb-video = { path = "crates/nvb-video" }
