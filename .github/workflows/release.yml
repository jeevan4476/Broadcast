name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional version label for manual build artifact (e.g. v2.3.0-rust.1)"
        required: false
        default: "dev-snapshot"

permissions:
  contents: write

jobs:
  verify-and-package:
    name: Verify, Build and Package Linux x86_64
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system and Python test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install pillow

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run Python, Bun, Shell, and Rust verification gates
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          bun test ./tests/*.test.js
          bash -n nv-broadcast install-deps.sh
          shellcheck nv-broadcast install-deps.sh
          (cd rust && cargo test --workspace && cargo clippy --workspace --all-targets -- -D warnings)

      - name: Build release Rust binaries
        working-directory: rust
        run: cargo build --release --locked -p nvb-cli -p nvb-daemon -p nvb-camera-worker

      - name: Package release tarball and SHA-256 checksums
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_TAG:-dev-snapshot}"
          fi
          STAGE="dist/nv-broadcast-${VERSION}-linux-x86_64"
          mkdir -p "${STAGE}/rust/target/release"
          cp -a nv-broadcast install-deps.sh README.md LICENSE "${STAGE}/" 2>/dev/null || cp -a nv-broadcast install-deps.sh README.md "${STAGE}/"
          cp -a nv_broadcast "${STAGE}/"
          mkdir -p "${STAGE}/ui"
          cp -a ui/index.html ui/main.js ui/preload.js ui/renderer.js ui/styles.css ui/tray.js ui/package.json ui/bun.lock ui/.npmrc "${STAGE}/ui/" 2>/dev/null || cp -a ui/*.js ui/*.html ui/*.css ui/package.json ui/bun.lock ui/.npmrc "${STAGE}/ui/"
          cp -a rust/target/release/nvb-cli rust/target/release/nvb-daemon rust/target/release/nvb-camera-worker "${STAGE}/rust/target/release/"
          strip "${STAGE}/rust/target/release/"nvb-* || true
          tar -C dist -czf "dist/nv-broadcast-${VERSION}-linux-x86_64.tar.gz" "nv-broadcast-${VERSION}-linux-x86_64"
          (cd dist && sha256sum "nv-broadcast-${VERSION}-linux-x86_64.tar.gz" > SHA256SUMS.txt)
          ls -lh dist/

      - name: Upload release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nv-broadcast-release-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
